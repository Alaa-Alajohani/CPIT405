<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4 | Auto Parts Order</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Great Auto Parts - Order Form</h1>
    </div>
  </header>
  <main class="page-shell">
    <form class="order-card" action="#" method="get">
      <div class="field"><label for="first-name">First Name:</label><input id="first-name" name="firstName" type="text" placeholder="Enter your first name"></div>
      <div class="field"><label for="last-name">Last Name:</label><input id="last-name" name="lastName" type="text" placeholder="Enter your last name"></div>
      <div class="field"><label for="email">Email:</label><input id="email" name="email" type="email" placeholder="Enter your email address"></div>
      <div class="field"><label for="phone">Phone number:</label><input id="phone" name="phone" type="tel" placeholder="Enter your phone number"></div>
      <div class="field"><label for="make">Make:</label><input id="make" name="make" type="text" placeholder="Make"></div>
      <div class="field"><label for="model">Model:</label><input id="model" name="model" type="text" placeholder="Model"></div>
      <div class="field"><label for="year">Year:</label><input id="year" name="year" type="number" placeholder="Year"></div>
      <div class="field"><label for="date">Date:</label><input id="date" name="date" type="date"></div>
      <div class="field"><label for="spare-part">Spare Part:</label><input id="spare-part" name="sparePart" type="text" placeholder="Enter the spare part you need"></div>
      <div class="field"><label for="quantity">Quantity:</label><input id="quantity" name="quantity" type="number" placeholder="Enter the quantity of the spare part you need"></div>
      <div class="field"><label for="comment">Comment:</label><textarea id="comment" name="comment" rows="6" placeholder="Enter your comment"></textarea></div>
      <button class="submit-button" type="submit">Submit</button>
    </form>
    <footer class="page-footer">CPIT 405 · Internet Applications <span>Lab 04: CSS Structure and Properties</span></footer>
  </main>
</body>
</html>
